<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hello, World!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1b3a2f;
    --ink-deep: #0f241d;
    --paper: #f4efe1;
    --paper-dim: #e8e0cb;
    --gold: #c9973f;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    background: var(--ink-deep);
    background-image:
      radial-gradient(circle at 20% 15%, rgba(201,151,63,0.08), transparent 40%),
      radial-gradient(circle at 85% 80%, rgba(201,151,63,0.06), transparent 45%);
    font-family: 'JetBrains Mono', monospace;
    color: var(--paper);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 6vh 1.5rem;
  }

  .plate {
    position: relative;
    background: var(--paper);
    color: var(--ink);
    width: min(640px, 100%);
    padding: 4.5rem 3rem 3.5rem;
    border-radius: 2px;
    box-shadow:
      0 1px 0 rgba(255,255,255,0.4) inset,
      0 30px 60px -20px rgba(0,0,0,0.65);
    text-align: center;
  }

  .plate::before {
    content: "";
    position: absolute;
    inset: 14px;
    border: 1px solid rgba(27,58,47,0.25);
    pointer-events: none;
  }

  .eyebrow {
    font-size: 0.7rem;
    letter-spacing: 0.14em;
    color: var(--gold);
    margin: 0 0 1.4rem;
  }

  h1 {
    font-family: 'Fraunces', serif;
    font-optical-sizing: auto;
    font-weight: 900;
    font-size: clamp(2.6rem, 8vw, 4.4rem);
    line-height: 1;
    margin: 0 0 1.1rem;
    letter-spacing: -0.01em;
    text-shadow: 0 1px 0 rgba(255,255,255,0.5);
  }

  h1 .comma { color: var(--gold); }

  .sub {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-weight: 400;
    font-size: 1.05rem;
    color: #4a4238;
    max-width: 34ch;
    margin: 0 auto 2.4rem;
    line-height: 1.5;
  }

  .rule {
    width: 46px;
    height: 2px;
    background: var(--gold);
    margin: 0 auto 2.4rem;
  }

  .stamp {
    display: inline-flex;
    align-items: center;
    gap: 0.6rem;
    padding: 0.65rem 1.1rem;
    border: 1px solid rgba(27,58,47,0.3);
    border-radius: 3px;
    font-size: 0.8rem;
    color: var(--ink);
    background: rgba(27,58,47,0.04);
  }

  .stamp .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #4caf6a;
    box-shadow: 0 0 0 3px rgba(76,175,106,0.18);
  }

  footer {
    margin-top: 2.6rem;
    font-size: 0.68rem;
    color: rgba(27,58,47,0.5);
    letter-spacing: 0.04em;
  }

  @media (prefers-reduced-motion: no-preference) {
    .plate { animation: rise 0.7s cubic-bezier(.2,.7,.3,1) both; }
    @keyframes rise {
      from { opacity: 0; transform: translateY(14px) scale(0.985); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
  }
</style>
</head>
<body>
  <main class="plate">
    <p class="eyebrow">FIRST RUN</p>
    <h1>Hello, World<span class="comma">!</span></h1>
    <p class="sub">Every language learns to speak the same way. This is the line that starts them all.</p>
    <div class="rule"></div>
    <div class="stamp"><span class="dot"></span> printed successfully</div>
    <footer>console.log &nbsp;·&nbsp; return 0</footer>
  </main>
</body>
</html>
