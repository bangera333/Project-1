<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact — Wren Kessler</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <a class="wordmark" href="about.html">Wren Kessler</a>
  <nav>
    <a href="about.html">About</a>
    <a href="contact.html" class="active">Contact</a>
  </nav>
</header>

<main>
  <p class="eyebrow">Contact</p>
  <h1>Tell me about the job.</h1>
  <p class="lede">A rough brief and a deadline is enough to start.</p>

  <form onsubmit="event.preventDefault(); alert('This is a demo form — hook it up to your email or a form service to go live.');">
    <label for="name">Name</label>
    <input id="name" type="text" required>

    <label for="email">Email</label>
    <input id="email" type="email" required>

    <label for="message">What's the project?</label>
    <textarea id="message" required></textarea>

    <button class="send-btn" type="submit">Send message</button>
  </form>

  <div class="direct">
    <p>Prefer email? Write to <a href="mailto:hello@wrenkessler.example">hello@wrenkessler.example</a>.</p>
  </div>
</main>

</body>
</html>
